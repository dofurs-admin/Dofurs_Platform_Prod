services:
  - type: web
    name: dofurs-single-page-website
    runtime: node
    plan: starter
    numInstances: 2
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: 20.11.1
      - key: NODE_OPTIONS
        value: --max-old-space-size=1024
      # CRM (Meta sheet import + abandoned-booking sweep endpoints). Secret
      # values are entered in the Render dashboard (sync: false), never in the repo.
      - key: GOOGLE_SHEETS_CLIENT_EMAIL
        sync: false
      - key: GOOGLE_SHEETS_PRIVATE_KEY
        sync: false
      - key: GOOGLE_SHEETS_LEADS_SPREADSHEET_ID
        sync: false
      - key: GOOGLE_SHEETS_LEADS_TABS
        sync: false
      - key: CRM_SHEET_IMPORT_SECRET
        sync: false
      # Webhook for the dedicated CRM alerts Discord channel (falls back to the
      # booking webhook with a console.warn until set).
      - key: DISCORD_CRM_WEBHOOK_URL
        sync: false
      # Abandoned-booking staleness window in minutes (1–60, default 10).
      - key: CRM_ABANDON_AFTER_MINUTES
        value: "10"

  - type: cron
    name: dofurs-billing-reminders-scheduler
    runtime: node
    plan: starter
    schedule: "*/30 * * * *"
    buildCommand: npm ci
    startCommand: npm run ops:billing:run:schedule
    envVars:
      - key: NODE_VERSION
        value: 20.11.1
      - key: BILLING_AUTOMATION_BASE_URL
        sync: false
      - key: BILLING_AUTOMATION_SECRET
        sync: false
      - key: BILLING_AUTOMATION_BUCKET
        value: all
      - key: BILLING_AUTOMATION_CHANNEL
        value: whatsapp
      - key: BILLING_AUTOMATION_ENFORCE_CADENCE
        value: "true"
      - key: BILLING_AUTOMATION_ENFORCE_COOLDOWN
        value: "true"
      - key: BILLING_AUTOMATION_DRY_RUN
        value: "false"
      - key: BILLING_AUTOMATION_ACCEPT_CONFLICT
        value: "true"

  - type: cron
    name: dofurs-cleanup-stale-transactions
    runtime: node
    plan: starter
    schedule: "15 2 * * *"
    buildCommand: npm ci
    startCommand: npm run ops:billing:run:cleanup-stale
    envVars:
      - key: NODE_VERSION
        value: 20.11.1
      - key: BILLING_AUTOMATION_BASE_URL
        sync: false
      - key: BILLING_AUTOMATION_SECRET
        sync: false


  # CRM automation scheduling is NOT on Render — it lives in Supabase pg_cron
  # (infra/supabase/migrations/101_crm_automation_pg_cron.sql: abandoned-booking
  # sweep every minute, Meta-sheet import every 5 min as the fallback for the
  # Google-Sheet push trigger in infra/apps-script/). The two cron services
  # that were previously declared here were never created on Render, and
  # database-side scheduling costs nothing extra.

