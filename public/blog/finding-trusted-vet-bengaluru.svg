<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="Finding a trusted vet in Bengaluru">
  <defs>
    <linearGradient id="vtbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff5ea"/>
      <stop offset="100%" stop-color="#ffdfb8"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#vtbg)"/>
  <g transform="translate(830,170)">
    <rect x="0" y="0" width="260" height="260" rx="32" fill="#ffffff" stroke="#e7c4a7" stroke-width="3"/>
    <rect x="115" y="50" width="30" height="160" fill="#e39a5d"/>
    <rect x="50" y="115" width="160" height="30" fill="#e39a5d"/>
  </g>
  <g transform="translate(90,140)" fill="#1f1f1f">
    <text x="0" y="0" font-family="Georgia, serif" font-weight="700" font-size="50">Finding a Trusted Vet</text>
    <text x="0" y="66" font-family="Georgia, serif" font-weight="700" font-size="50">in Bengaluru</text>
    <text x="0" y="130" font-family="Verdana, sans-serif" font-size="24" fill="#5f5f5f">What to check, what to ask, what to avoid</text>
  </g>
  <g transform="translate(90,360)" fill="#8b633f">
    <rect x="0" y="0" width="220" height="60" rx="14" fill="#ffffff" stroke="#e7c4a7"/>
    <text x="20" y="40" font-family="Verdana, sans-serif" font-size="18">✓ Credentials</text>
    <rect x="240" y="0" width="220" height="60" rx="14" fill="#ffffff" stroke="#e7c4a7"/>
    <text x="260" y="40" font-family="Verdana, sans-serif" font-size="18">✓ Experience</text>
    <rect x="480" y="0" width="220" height="60" rx="14" fill="#ffffff" stroke="#e7c4a7"/>
    <text x="500" y="40" font-family="Verdana, sans-serif" font-size="18">✓ Communication</text>
  </g>
</svg>
