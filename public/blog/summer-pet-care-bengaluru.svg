    <rect x="260" y="0" width="240" height="70" rx="16" fill="#ffffff" stroke="#e7c4a7"/>
    <text x="280" y="45" font-family="Verdana, sans-serif" font-size="20">🌳 Walk timing</text>
    <rect x="520" y="0" width="240" height="70" rx="16" fill="#ffffff" stroke="#e7c4a7"/>
    <text x="540" y="45" font-family="Verdana, sans-serif" font-size="20">🐾 Paw safety</text>
  </g>
