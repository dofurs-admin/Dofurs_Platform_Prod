<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="Summer pet care in Bengaluru">
  <defs>
    <linearGradient id="sbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff6e0"/>
      <stop offset="60%" stop-color="#fff9ec"/>
      <stop offset="100%" stop-color="#ffe0b6"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#sbg)"/>
  <circle cx="950" cy="180" r="120" fill="#f5c86a"/>
  <g stroke="#e6a24a" stroke-width="6" stroke-linecap="round">
    <line x1="950" y1="20" x2="950" y2="60"/>
    <line x1="950" y1="300" x2="950" y2="340"/>
    <line x1="780" y1="180" x2="820" y2="180"/>
    <line x1="1080" y1="180" x2="1120" y2="180"/>
    <line x1="840" y1="70" x2="870" y2="100"/>
    <line x1="1030" y1="70" x2="1060" y2="100"/>
    <line x1="840" y1="290" x2="870" y2="260"/>
    <line x1="1030" y1="290" x2="1060" y2="260"/>
  </g>
  <g transform="translate(90,120)" fill="#1f1f1f">
    <text x="0" y="0" font-family="Georgia, serif" font-weight="700" font-size="52">Summer Pet Care</text>
    <text x="0" y="68" font-family="Georgia, serif" font-weight="700" font-size="52">in Bengaluru</text>
    <text x="0" y="138" font-family="Verdana, sans-serif" font-size="26" fill="#5f5f5f">Hydration, heat &amp; walks — a heatwave survival guide</text>
  </g>
