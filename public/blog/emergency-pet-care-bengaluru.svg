<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="Emergency pet care in Bengaluru">
  <defs>
    <linearGradient id="epbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff6ef"/>
      <stop offset="100%" stop-color="#ffd2b5"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#epbg)"/>
  <g transform="translate(820,170)">
    <circle cx="150" cy="150" r="140" fill="#ffffff" stroke="#cf4a3a" stroke-width="6"/>
    <rect x="130" y="60" width="40" height="180" rx="6" fill="#cf4a3a"/>
    <rect x="60" y="130" width="180" height="40" rx="6" fill="#cf4a3a"/>
  </g>
  <g transform="translate(90,140)" fill="#1f1f1f">
    <text x="0" y="0" font-family="Georgia, serif" font-weight="700" font-size="52">Emergency Pet Care</text>
    <text x="0" y="68" font-family="Georgia, serif" font-weight="700" font-size="52">in Bengaluru</text>
    <text x="0" y="130" font-family="Verdana, sans-serif" font-size="24" fill="#5f5f5f">What to do before the vet arrives — first response basics</text>
  </g>
  <g transform="translate(90,380)">
    <rect x="0" y="0" width="230" height="90" rx="16" fill="#ffffff" stroke="#e7c4a7"/>
    <text x="20" y="40" font-family="Verdana, sans-serif" font-size="18" fill="#8b633f" font-weight="700">STAY CALM</text>
    <text x="20" y="70" font-family="Verdana, sans-serif" font-size="14" fill="#5f5f5f">Secure the area first</text>
    <rect x="250" y="0" width="230" height="90" rx="16" fill="#ffffff" stroke="#e7c4a7"/>
    <text x="270" y="40" font-family="Verdana, sans-serif" font-size="18" fill="#8b633f" font-weight="700">CALL A VET</text>
    <text x="270" y="70" font-family="Verdana, sans-serif" font-size="14" fill="#5f5f5f">Describe clearly</text>
    <rect x="500" y="0" width="230" height="90" rx="16" fill="#e39a5d" stroke="#cf8448"/>
    <text x="520" y="40" font-family="Verdana, sans-serif" font-size="18" fill="#ffffff" font-weight="700">STABILISE</text>
    <text x="520" y="70" font-family="Verdana, sans-serif" font-size="14" fill="#ffffff">Transport safely</text>
  </g>
</svg>
