<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="Puppy vaccination schedule India">
  <defs>
    <linearGradient id="pvbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff4e7"/>
      <stop offset="100%" stop-color="#ffe1c1"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#pvbg)"/>
  <g transform="translate(90,120)" fill="#1f1f1f">
    <text x="0" y="0" font-family="Georgia, serif" font-weight="700" font-size="52">Puppy Vaccination Schedule</text>
    <text x="0" y="66" font-family="Georgia, serif" font-weight="700" font-size="52">for Indian Pet Parents</text>
    <text x="0" y="130" font-family="Verdana, sans-serif" font-size="26" fill="#5f5f5f">Core, optional &amp; booster doses — week by week</text>
  </g>
  <g transform="translate(90,340)">
    <circle cx="70" cy="90" r="60" fill="#ffffff" stroke="#e7c4a7" stroke-width="3"/>
    <text x="70" y="95" font-family="Verdana, sans-serif" font-size="20" fill="#8b633f" text-anchor="middle" font-weight="700">6–8w</text>
    <text x="70" y="190" font-family="Verdana, sans-serif" font-size="16" fill="#5f5f5f" text-anchor="middle">DHPP 1</text>
    <circle cx="260" cy="90" r="60" fill="#ffffff" stroke="#e7c4a7" stroke-width="3"/>
    <text x="260" y="95" font-family="Verdana, sans-serif" font-size="20" fill="#8b633f" text-anchor="middle" font-weight="700">10–12w</text>
    <text x="260" y="190" font-family="Verdana, sans-serif" font-size="16" fill="#5f5f5f" text-anchor="middle">DHPP 2</text>
    <circle cx="450" cy="90" r="60" fill="#ffffff" stroke="#e7c4a7" stroke-width="3"/>
    <text x="450" y="95" font-family="Verdana, sans-serif" font-size="20" fill="#8b633f" text-anchor="middle" font-weight="700">14–16w</text>
    <text x="450" y="190" font-family="Verdana, sans-serif" font-size="16" fill="#5f5f5f" text-anchor="middle">DHPP 3 + Rabies</text>
    <circle cx="640" cy="90" r="60" fill="#e39a5d" stroke="#cf8448" stroke-width="3"/>
    <text x="640" y="95" font-family="Verdana, sans-serif" font-size="20" fill="#ffffff" text-anchor="middle" font-weight="700">1 yr</text>
    <text x="640" y="190" font-family="Verdana, sans-serif" font-size="16" fill="#5f5f5f" text-anchor="middle">Annual booster</text>
    <line x1="130" y1="90" x2="200" y2="90" stroke="#cf8448" stroke-width="2" stroke-dasharray="4 4"/>
    <line x1="320" y1="90" x2="390" y2="90" stroke="#cf8448" stroke-width="2" stroke-dasharray="4 4"/>
    <line x1="510" y1="90" x2="580" y2="90" stroke="#cf8448" stroke-width="2" stroke-dasharray="4 4"/>
  </g>
</svg>
