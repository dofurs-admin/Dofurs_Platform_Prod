<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="Pet boarding vs pet sitting in Bengaluru">
  <defs>
    <linearGradient id="bvs-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff8ef"/>
      <stop offset="100%" stop-color="#fde6cf"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bvs-bg)"/>
  <g transform="translate(90,120)" fill="#1f1f1f">
    <text x="0" y="0" font-family="Georgia, serif" font-weight="700" font-size="50">Pet Boarding vs. Pet Sitting</text>
    <text x="0" y="66" font-family="Georgia, serif" font-weight="700" font-size="50">in Bengaluru</text>
    <text x="0" y="130" font-family="Verdana, sans-serif" font-size="26" fill="#5f5f5f">Which is right for your pet when you travel?</text>
  </g>
  <g transform="translate(120,310)">
    <rect x="0" y="0" width="420" height="240" rx="24" fill="#ffffff" stroke="#e7c4a7"/>
    <text x="24" y="50" font-family="Verdana, sans-serif" font-size="22" fill="#8b633f" font-weight="700">BOARDING</text>
    <text x="24" y="90" font-family="Verdana, sans-serif" font-size="18" fill="#5f5f5f">🏡 Pet stays with caregiver</text>
    <text x="24" y="120" font-family="Verdana, sans-serif" font-size="18" fill="#5f5f5f">👥 Social environment</text>
    <text x="24" y="150" font-family="Verdana, sans-serif" font-size="18" fill="#5f5f5f">⏰ 24/7 supervision</text>
    <text x="24" y="180" font-family="Verdana, sans-serif" font-size="18" fill="#5f5f5f">💰 From ₹999/night</text>
  </g>
  <g transform="translate(660,310)">
    <rect x="0" y="0" width="420" height="240" rx="24" fill="#e39a5d" stroke="#cf8448"/>
    <text x="24" y="50" font-family="Verdana, sans-serif" font-size="22" fill="#ffffff" font-weight="700">SITTING</text>
    <text x="24" y="90" font-family="Verdana, sans-serif" font-size="18" fill="#ffffff">🏠 Sitter comes to your home</text>
    <text x="24" y="120" font-family="Verdana, sans-serif" font-size="18" fill="#ffffff">🐕 Same routine &amp; surroundings</text>
    <text x="24" y="150" font-family="Verdana, sans-serif" font-size="18" fill="#ffffff">📷 Photo &amp; video updates</text>
    <text x="24" y="180" font-family="Verdana, sans-serif" font-size="18" fill="#ffffff">💰 Per-visit or full-day</text>
  </g>
</svg>
