<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="Pet-friendly Bengaluru">
  <defs>
    <linearGradient id="pfbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff8ef"/>
      <stop offset="100%" stop-color="#ffdbb0"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#pfbg)"/>
  <g transform="translate(90,140)" fill="#1f1f1f">
    <text x="0" y="0" font-family="Georgia, serif" font-weight="700" font-size="54">Pet-Friendly Bengaluru</text>
    <text x="0" y="70" font-family="Verdana, sans-serif" font-size="26" fill="#5f5f5f">Parks, cafés, stays and hangouts — with your pet</text>
  </g>
  <g transform="translate(100,300)">
    <rect x="0" y="0" width="220" height="220" rx="20" fill="#ffffff" stroke="#e7c4a7"/>
    <text x="110" y="50" font-family="Verdana, sans-serif" font-size="60" text-anchor="middle">🌳</text>
    <text x="110" y="120" font-family="Verdana, sans-serif" font-size="22" fill="#1f1f1f" font-weight="700" text-anchor="middle">Parks</text>
    <text x="110" y="160" font-family="Verdana, sans-serif" font-size="14" fill="#5f5f5f" text-anchor="middle">Cubbon • Lalbagh</text>
    <rect x="240" y="0" width="220" height="220" rx="20" fill="#ffffff" stroke="#e7c4a7"/>
    <text x="350" y="50" font-family="Verdana, sans-serif" font-size="60" text-anchor="middle">☕</text>
    <text x="350" y="120" font-family="Verdana, sans-serif" font-size="22" fill="#1f1f1f" font-weight="700" text-anchor="middle">Cafés</text>
    <text x="350" y="160" font-family="Verdana, sans-serif" font-size="14" fill="#5f5f5f" text-anchor="middle">Paws &amp; Coffee</text>
    <rect x="480" y="0" width="220" height="220" rx="20" fill="#ffffff" stroke="#e7c4a7"/>
    <text x="590" y="50" font-family="Verdana, sans-serif" font-size="60" text-anchor="middle">🏨</text>
    <text x="590" y="120" font-family="Verdana, sans-serif" font-size="22" fill="#1f1f1f" font-weight="700" text-anchor="middle">Stays</text>
    <text x="590" y="160" font-family="Verdana, sans-serif" font-size="14" fill="#5f5f5f" text-anchor="middle">Farm stays &amp; resorts</text>
    <rect x="720" y="0" width="220" height="220" rx="20" fill="#e39a5d" stroke="#cf8448"/>
    <text x="830" y="50" font-family="Verdana, sans-serif" font-size="60" text-anchor="middle">🐕</text>
    <text x="830" y="120" font-family="Verdana, sans-serif" font-size="22" fill="#ffffff" font-weight="700" text-anchor="middle">Playdates</text>
    <text x="830" y="160" font-family="Verdana, sans-serif" font-size="14" fill="#ffffff" text-anchor="middle">Community meetups</text>
  </g>
</svg>
